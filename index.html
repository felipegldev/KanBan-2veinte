<!DOCTYPE html>
<html lang="en">
<!--METADATOS-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Titulo del proyecto-->
    <title>To-Do Kanban</title>
    <!--CSS del proyecto-->
    <link rel="stylesheet" href="./styles.css">
    <!--CSS de Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<!--CUERPO DE LA PÁGINA-->
<body>
    <!--NAVBAR-->
    <div id="header">
        <!--ICONO-->
        <img src="./img/16829311.png" alt="foto navbar" id="logo">
        <h1> Kanban To - Do | 2veinte</h1>
    </div>
    <!--CONTENEDOR QUE ENVUELVE TODO EL CONTENIDO-->
    <div class="container-main">
        <!--CONTENEDOR CON CLASE PARA LAS TAREAS-->
        <div class="container-task">
            <!--TASK ADD PARA FORMULARIO DE AGREGAR TAREAS-->
            <div id="task-add">
            <!--TITULO CON CLASE PARA LAS TAREAS-->
            <h3 class="titulo-task"> Agregar Tareas </h3>
            <hr>
                <form action="submit">
                    <!--Task Name para rescatar el valor del input-->
                    <strong>Nombre Tarea</strong>
                    <input type="text" id="task-name" placeholder="Inserte nombre de la tarea">
                    <!--Task Desc para rescatar el valor del input-->
                    <strong>Descripción de la Tarea</strong>
                    <input type="text" id="task-desc" placeholder="Inserte Descripción de la tarea a realizar">
                    <!--Task Resp para rescatar el valor del input-->
                    <strong>Responsable de la tarea</strong>
                    <input type="text" id="task-resp" placeholder="Inserte al Responsable">
                    <!--Fecha inicio-->
                    <strong>Fecha Inicio:</strong>
                    <input type="date" id="fecha_ini">
                    <strong>Fecha Fin:</strong>
                    <input type="date" id="fecha_fin">
                    <button type="submit" id="submit">AGREGAR TAREA</button>
                </form>
            </div>
        </div>
        <!--CONTENEDOR PARA LAS TAREAS EN CURSO-->
        <div class="container-task">
            <div id="task-curso">
                <h3 class="titulo-task">Tareas en Curso</h3>
                <span id="cont-curso">0</span>
                <hr>
            </div>
        </div>
        <!--CONTAINER PARA TAREAS PENDIENTES-->
        <div class="container-task">
            <div id="task-pend">
                <h3 class="titulo-task">Tareas Pendientes</h3>
                <span id="cont-pend">0</span>
                <hr>
            </div>
        </div>
        <!--CONTAINER PARA LAS TAREAS REALIZADAS-->
        <div class="container-task">
            <div id="task-fin">
                <h3 class="titulo-task">Tareas Realizadas</h3>
                <span id="cont-real">0</span>
                <hr>
            </div>
        </div>
    <!--CIERRE DE CONTENEDOR PRINCIPAL-->
    </div>
</body>

<!--SCRIPT de Bootstrap-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<!--Script para Funciones del KanBan-->
<script src="./script.js"></script>
</html>
