<!DOCTYPE html>
<html lang="en">
<!--METADATOS-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Titulo del proyecto-->
    <title>To-Do Kanban</title>
    <!--CSS del proyecto-->
    <link rel="stylesheet" href="./styles.css">
    <!--CSS de Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>
<!--CUERPO DE LA PÁGINA-->
<body>
    <!--NAVBAR-->
    <div class="head">
        <!--ICONO-->
        <img src="./img/16829311.png" alt="foto navbar">
    </div>
    <div id="container-main">
        <!--Contenedor para agregar tareas-->
        <div id="container-task">

            <!--Nombre del titulo del KanBan-->
            <div class="titulo-kanban">
                <!--En este caso 2veinte-->
                <strong class="label-kanban"> Tareas para agregar </strong>
            </div>

            <!--Cuerpo del KanBan-->
            <div class="cuerpo-kanban">

                <!--Se declara el formulario-->
                <div class="kanban-block form-kanban">

                    <!--Tipos de input declarados-->
                    <div class="container-inputs">
                        <strong class="strong-input">Nombre Tarea</strong>
                        <input type="text" id="tarea-nombre" class="input-text" placeholder="Ingrese el nombre de la tarea...">

                        <strong class="strong-input">Descripción Tarea</strong>
                        <textarea type="text" id="tarea-desc" class="input-text" placeholder="Describa su tarea..."></textarea>

                        <strong class="strong-input">Responsable de la tarea</strong>
                        <input type="text" id="responsable" class="input-text" placeholder="Ingrese su nombre o el responsable a cargo...">
                    </div>

                    <!--Boton para enviar tarea por JavaScript-->
                    <button type="submit" id="submit"> Enviar Tarea </button>
                </div>
            </div>
        </div>

        <!--Contenedor para tareas en curso-->
        <div id="container-realizadas">

            <!--Nombre del titulo del KanBan-->
            <div class="titulo-kanban">
                <!--En este caso 2veinte-->
                <strong class="label-kanban"> Tareas en Curso </strong>
            </div>
        </div>

        <!--Contenedor para tareas en curso-->
        <div id="container-proceso">

            <!--Nombre del titulo del KanBan-->
            <div class="titulo-kanban">
                <!--En este caso 2veinte-->
                <strong class="label-kanban"> Tareas en Proceso </strong>
            </div>
        </div>

        <!--Contenedor para las tareas finalizadas-->
        <div id="container-finish">
            <!--Nombre del titulo del KanBan-->
            <div class="titulo-kanban">
                <!--En este caso 2veinte-->
                <strong class="label-kanban">Tareas finalizadas</strong>
            </div>
        </div>
    </div>
</body>

<!--SCRIPT de Bootstrap-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<!--Script para Funciones del KanBan-->
<script src="./script.js"></script>
</html>
